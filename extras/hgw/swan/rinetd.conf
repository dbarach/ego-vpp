#
# this is the configuration file for rinetd, the internet redirection server
#
# you may specify global allow and deny rules here
# only ip addresses are matched, hostnames cannot be specified here
# the wildcards you may use are * and ?
#
# allow 192.168.2.*
# deny 192.168.2.1?


#
# forwarding rules come here
#
# you may specify allow and deny rules after a specific forwarding rule
# to apply to only that forwarding rule
#
# bindadress    bindport  connectaddress  connectport

# Dora dvr
# 127.0.0.1 80 192.168.1.202 80
# 127.0.0.1 9000 192.168.1.202 9000

# Dora ptz
# 127.0.0.1 8086 192.168.1.203 8086
# 127.0.0.1 5554 192.168.1.203 5554
# 127.0.0.1 1935 192.168.1.203 1935

# Swan DVR #1
127.0.0.1 11000 192.168.1.201 11000
127.0.0.1 11001 192.168.1.201 11001
127.0.0.1 11002 192.168.1.201 11002

# Swan DVR #2
127.0.0.1 12000 192.168.1.203 12000
127.0.0.1 12001 192.168.1.203 12001
127.0.0.1 12002 192.168.1.203 12002

# Swan Wireless Bridge
127.0.0.1 8081 192.168.1.220 80


# logging information
logfile /var/log/rinetd.log

# uncomment the following line if you want web-server style logfile format
# logcommon
