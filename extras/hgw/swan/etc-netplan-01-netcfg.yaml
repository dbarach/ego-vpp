# This file describes the network interfaces available on your system
# For more information, see netplan(5).
network:
  version: 2
  renderer: networkd
  ethernets:
    enp4s0:
      dhcp4: no
      addresses: [192.168.2.254/24]
      gateway4: 192.168.2.100
      nameservers:
        search: [my.local]
        addresses: [8.8.8.8]
